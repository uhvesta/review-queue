[workspace]
resolver = "2"
members = ["crates/review-queue-core", "crates/review-queue-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Review Queue contributors"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
tempfile = "3.15"
libc = "0.2"
base64 = "0.22"
