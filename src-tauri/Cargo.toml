[package]
name = "review-queue-desktop"
version = "0.1.0"
description = "Signed desktop shell for Review Queue"
authors = ["Review Queue contributors"]
edition = "2024"
license = "MIT"
default-run = "review-queue-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
review-queue-core = { path = "../crates/review-queue-core" }
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "native-tls"] }
uuid = { version = "1.12", features = ["v4"] }
github-copilot-sdk = "=1.0.0-beta.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
similar = "2"

[dev-dependencies]
tempfile = "3"

# Keep this application outside the existing data-plane workspace until the
# desktop toolchain is available in CI and release environments.
[workspace]
